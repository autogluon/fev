name: Benchmark submission comment

# Trusted companion to benchmark-submission.yml. Triggered when that workflow completes, this runs
# in the BASE repo context (not the fork), so it can hold pull-requests:write. It never checks out
# or runs PR code: it only downloads the artifact the untrusted job produced and posts it as a
# comment. That separation is what makes commenting on fork PRs safe.
on:
  workflow_run:
    workflows: ["Benchmark submission checks"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download comment payload
        uses: actions/download-artifact@v4
        with:
          name: benchmark-submission-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim(), 10);
            if (!Number.isInteger(prNumber)) {
              core.setFailed('Could not read a valid PR number from the artifact.');
              return;
            }
            const table = fs.readFileSync('table.md', 'utf8');
            const marker = '<!-- fev-bench-submission-check -->';
            const body = `${marker}\n:white_check_mark: Submission checks passed. Here is the new table:\n\n${table}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
