name: Benchmark submission checks

# Runs on every PR that touches benchmarks/. This job runs UNTRUSTED submission code/data, so it
# is deliberately powerless: default read-only token, no secrets, no write permissions. It only
# validates the submission and renders a leaderboard table into an artifact. A separate trusted
# workflow (benchmark-submission-comment.yml) posts that table as a PR comment.
on:
  pull_request:
    paths:
      - "benchmarks/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Validate submissions
        run: pytest test/test_fev_bench_submissions.py -q

      - name: Collect changed result files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            -- 'benchmarks/fev_bench/results/*.csv' | xargs -n1 basename | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Render leaderboard table
        run: |
          python scripts/render_fev_bench_leaderboard.py \
            --output table.md --changed ${{ steps.changed.outputs.files }}
          echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Also show table in the run summary
        run: cat table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comment payload
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-submission-comment
          path: |
            table.md
            pr_number.txt
          retention-days: 1
