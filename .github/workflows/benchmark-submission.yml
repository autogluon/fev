name: Benchmark submission checks

# Read-only, no secrets. Validates fev-bench submissions and prints the leaderboard to the logs.
on:
  pull_request:
    paths:
      - "benchmarks/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Validate submissions
        run: pytest test/test_fev_bench_submissions.py -q

      - name: Print leaderboard
        run: python scripts/render_fev_bench_leaderboard.py
